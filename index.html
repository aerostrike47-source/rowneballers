<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RówneBaller - Quizy Piłkarskie</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* WEJŚCIE / NICK */
    .auth-container {
      max-width: 400px;
      margin: auto;
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 90%;
    }

    .auth-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #94a3b8;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 15px;
    }

    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #0369a1;
    }

    .error-msg {
      color: #ef4444;
      font-size: 13px;
      margin-bottom: 15px;
      text-align: center;
    }

    /* STRONA GŁÓWNA */
    #app-content {
      display: none;
      flex-direction: column;
      min-height: 100vh;
    }

    nav {
      background: #1e293b;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #38bdf8;
    }

    .user-info {
      font-size: 15px;
      color: #94a3b8;
    }

    .user-info strong {
      color: #38bdf8;
    }

    .btn-change-nick {
      background: #475569;
      padding: 6px 12px;
      border-radius: 4px;
      color: white;
      border: none;
      cursor: pointer;
      margin-left: 15px;
      font-size: 13px;
    }

    .btn-change-nick:hover {
      background: #64748b;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .welcome-text {
      font-size: 28px;
      font-weight: 700;
      max-width: 800px;
      line-height: 1.4;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      animation: shine 4s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }
  </style>
</head>
<body>

  <!-- EKRAN PODAWANIA NICKU -->
  <div id="auth-screen" style="display: flex; min-height: 100vh; width: 100%;">
    <div class="auth-container">
      <h2>Wpisz swój Nick</h2>
      <div id="error-message" class="error-msg"></div>
      
      <form id="nick-form">
        <div class="form-group">
          <label for="username">Twój unikalny nick do quizów:</label>
          <input type="text" id="username" placeholder="np. Baller10" required>
        </div>

        <button type="submit" class="btn">Wejdź na stronę</button>
      </form>
    </div>
  </div>

  <!-- STRONA GŁÓWNA -->
  <div id="app-content">
    <nav>
      <div class="logo">RówneBaller</div>
      <div class="nav-right" style="display: flex; align-items: center;">
        <span class="user-info">Cześć, <strong id="user-display-name">Gracz</strong>!</span>
        <button class="btn-change-nick" id="change-nick-btn">Zmień nick</button>
      </div>
    </nav>

    <main>
      <h1 class="welcome-text">
        Witaj na stronie rowneballer rozwiązuj swoje quizy i walcz o nagrody więcej o tym masz w zakładce info-konkurs
      </h1>
    </main>
  </div>

  <!-- FIREBASE INTEGRACJA -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ⬇️ TUTAJ WKLEJ SWOJE DANE Z FIREBASE (DANE MOŻESZ TEŻ ZOSTAWIĆ, JEŚLI CHCESZ TYLKO ZAPAMIĘTYWANIE W BROWSERZE) ⬇️
    const firebaseConfig = {
      apiKey: "TWÓJ_API_KEY",
      authDomain: "TWÓJ_PROJECT_ID.firebaseapp.com",
      projectId: "TWÓJ_PROJECT_ID",
      storageBucket: "TWÓJ_PROJECT_ID.appspot.com",
      messagingSenderId: "TWÓJ_SENDER_ID",
      appId: "TWÓJ_APP_ID"
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch(e) {
      console.log("Firebase nie podpięty lub błędny key - tryb lokalny active");
    }

    const authScreen = document.getElementById('auth-screen');
    const appContent = document.getElementById('app-content');
    const nickForm = document.getElementById('nick-form');
    const errorMsg = document.getElementById('error-message');
    const userDisplayName = document.getElementById('user-display-name');
    const changeNickBtn = document.getElementById('change-nick-btn');

    // Sprawdzanie czy nick jest już zapisany w przeglądarce
    const savedNick = localStorage.getItem('rowneballer_nick');

    if (savedNick) {
      showApp(savedNick);
    }

    // Obsługa formularza
    nickForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      const username = document.getElementById('username').value.trim();

      if (!username) {
        errorMsg.textContent = 'Wpisz prawidłowy nick!';
        return;
      }

      // Jeśli Firebase działa, sprawdzamy czy nick jest wolny
      if (db && !firebaseConfig.apiKey.includes("TWÓJ_API_KEY")) {
        try {
          const usernameClean = username.toLowerCase();
          const userDocRef = doc(db, "usernames", usernameClean);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists()) {
            errorMsg.textContent = 'Ten nick jest już zajęty! Wybierz inny.';
            return;
          }

          // Zapisujemy nick w Firebase
          await setDoc(userDocRef, { created: new Date() });
        } catch (err) {
          console.error(err);
        }
      }

      // Zapis w przeglądarce i wejście na stronę
      localStorage.setItem('rowneballer_nick', username);
      showApp(username);
    });

    function showApp(nick) {
      userDisplayName.textContent = nick;
      authScreen.style.display = 'none';
      appContent.style.display = 'flex';
    }

    // Zmiana nicku / wylogowanie lokalne
    changeNickBtn.addEventListener('click', () => {
      localStorage.removeItem('rowneballer_nick');
      authScreen.style.display = 'flex';
      appContent.style.display = 'none';
    });
  </script>
</body>
</html>
